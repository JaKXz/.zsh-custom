#:schema https://docs.jj-vcs.dev/latest/config-schema.json
# https://github.com/jj-vcs/jj/blob/main/docs/config.md#user-config-files

[aliases]
# TODO: jj edit -
# jj edit 'at_operation(@-, @)'

da = ["abandon", "--no-integrate-operation", "outdated()"]
dm = ["diff", "-r", "trunk()..@", "--name-only"]

# `jj git-sha [revision]` prints the full Git commit SHA (defaults to `@-`).
git-sha = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
revision="${1:-@-}"
jj log -r "$revision" --no-graph -T 'commit_id ++ "\n"'
''', ""]

ll = ["log", "-r", "all()", "--limit", "20"]
lll = ["log", "-r", "all()"]

# `jj push <suffix>` to create/move `jakxz/<suffix>` at @, track it, and push.
# `bookmark set` is create-or-update, so this works for the first push and for
# every re-push after an amend. `git push -b` auto-tracks a new bookmark on its
# own, so this doesn't depend on `auto-track-created-bookmarks` firing.
# Extra args pass through to `bookmark set` (e.g. `-r <rev>`, `-B`).
#   jj push BEE-939/new-feature  ->  jakxz/BEE-939/new-feature
push = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
if [ $# -eq 0 ]; then
  echo "usage: jj push <name-suffix> [args for 'jj bookmark set']" >&2
  exit 2
fi
name="jakxz/$1"; shift
jj bookmark set "$name" "$@"
jj git push -b "$name"
''', ""]

rbm = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
jj git fetch
jj rebase -b bases -o 'trunk()' "$@"
''', ""]

# `jj restack` to rebase your changes onto `trunk()`
restack = [
  "rebase",
  "--onto",
  "trunk()",
  "--source",
  "roots(trunk()..) & mutable()",
  "--simplify-parents",
]

# `jj squash-bookmark [starting-revision]` combines the current bookmark's stack through
# revision (default: @) into its first commit, stopping at the preceding bookmark.
# Requires a local bookmark at or behind revision. Uses jj's description editor.
squash-bookmark = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  '''
set -euo pipefail
fail() { echo "jj squash-bookmark: $*" >&2; exit 2; }
single_commit() {
  local id
  id=$(jj log --no-graph -r "$1" -T 'commit_id ++ "\n"') || return
  case "$id" in
    "" | *$'\n'*) fail "$2 must resolve to exactly one commit" ;;
  esac
  printf '%s\n' "$id"
}

[ $# -le 1 ] || fail "usage: jj squash-bookmark [starting-revision]"
tip=$(single_commit "${1-@}" "revision")
current=$(single_commit "squash_bookmark(commit_id($tip))" "current bookmark")
range="squash_range(commit_id($tip))"

conflicted=$(jj bookmark list --conflicted -r "trunk()..commit_id($tip)" -T 'if(!remote, name ++ "\n")')
[ -z "$conflicted" ] || fail "conflicted bookmarks in the stack: $conflicted"
invalid=$(jj log -r "$range & (merges() | immutable())" --count)
[ "$invalid" -eq 0 ] || fail "the selected range must contain only mutable, non-merge commits"

first=$(single_commit "roots($range)" "first commit")
sources="$range ~ commit_id($first)"
count=$(jj log -r "$sources" --count)
if [ "$count" -eq 0 ]; then
  echo "Nothing to squash."
  exit 0
fi

destination=$(jj log --no-graph -r "commit_id($first)" -T change_id)
bookmark_names=$(jj log --no-graph -r "commit_id($current)" -T 'local_bookmarks.map(|b| b.name()).join("\n")')
names=()
while IFS= read -r name; do
  names+=("$name")
done <<< "$bookmark_names"

jj squash --from "$sources" --into "commit_id($first)"
# Squash abandons source commits and deletes their bookmarks. Restore the names
# only after success, using the first commit's change ID to follow its rewrite.
jj bookmark set --revision "change_id($destination)" -- "${names[@]}"
''',
  "",
]

# https://isaaccorbrey.com/notes/jujutsu-megamerges-for-fun-and-profit
# `jj stack <revset>` to include specific revs
stack = ["rebase", "--after", "trunk()", "--before", "closest_merge(@)", "--revision"]

# `jj stage` to include the whole stack after the megamerge
stage = ["stack", "closest_merge(@)+:: ~ empty()"]

[colors]
total_added = "green"
total_removed = "red"

