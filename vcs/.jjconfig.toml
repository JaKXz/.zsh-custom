#:schema https://docs.jj-vcs.dev/latest/config-schema.json
# https://github.com/jj-vcs/jj/blob/main/docs/config.md#user-config-files

[aliases]
da = ["abandon", "--no-integrate-operation", "outdated()"]

# `jj git-sha [revision]` prints the full Git commit SHA (defaults to `@-`).
git-sha = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  '''
set -euo pipefail
revision="${1:-@-}"
jj log -r "$revision" --no-graph -T 'commit_id ++ "\n"'
''',
  ""
]

ll = ["log", "-r", "all()", "--limit", "20"]
lll = ["log", "-r", "all()"]

# `jj push <suffix>` to create/move `jakxz/<suffix>` at @, track it, and push.
# `bookmark set` is create-or-update, so this works for the first push and for
# every re-push after an amend. `git push -b` auto-tracks a new bookmark on its
# own, so this doesn't depend on `auto-track-created-bookmarks` firing.
# Extra args pass through to `bookmark set` (e.g. `-r <rev>`, `-B`).
#   jj push BEE-939/new-feature  ->  jakxz/BEE-939/new-feature
push = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  '''
set -euo pipefail
if [ $# -eq 0 ]; then
  echo "usage: jj push <name-suffix> [args for 'jj bookmark set']" >&2
  exit 2
fi
name="jakxz/$1"; shift
jj bookmark set "$name" "$@"
jj git push -b "$name"
''',
  ""
]

# `jj restack` to rebase your changes onto `trunk()`
restack = ["rebase", "--onto", "trunk()", "--source", "roots(trunk()..) & mutable()", "--simplify-parents"]

# https://isaaccorbrey.com/notes/jujutsu-megamerges-for-fun-and-profit
# `jj stack <revset>` to include specific revs
stack = ["rebase", "--after", "trunk()", "--before", "closest_merge(@)", "--revision"]

# `jj stage` to include the whole stack after the megamerge
stage = ["stack", "closest_merge(@)+:: ~ empty()"]

[remotes.origin]
auto-track-created-bookmarks = "glob:jakxz/*"

[revset-aliases]
"bases" = 'bookmarks(glob:"jakxz/*")'
"branches" = "downstream(trunk(), bookmarks()) & mine()"
"branchesandheads" = "bookmarks() | (heads(trunk()::) & mine())"
"connected" = "::@ | @::"
"curbranch" = "latest(branches::@- & branches)"
"downstream(x,y)" = "(x::y) & y"
"nextbranch" = "roots(@:: & branchesandheads)"

"closest_merge(to)" = "heads(::to & merges())"
"outdated()" = "mutable() ~ trunk()::"
"outdated(x)" = "x:: & mutable() ~ trunk()::"

[revset-aliases."closest_pushable(to)"]
definition = 'heads(::to & mutable() & ~empty() & description(regex:".+"))'
doc = "Closest mutable, non-empty, described commits at or behind to"

[revsets]
# log focused on my work
# log = "@ | bases | branches | curbranch::@ | @::nextbranch | downstream(@, branchesandheads)"

# bookmark-advance-to = "closest_pushable(@)"

